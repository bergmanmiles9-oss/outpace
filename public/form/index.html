<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Outpace — Application</title>
    <meta name="description" content="Outpace Staff Application">
    <link rel="stylesheet" href="/styles.css">

    <script defer src="/__/firebase/12.17.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.17.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.17.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/12.17.0/firebase-analytics-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>
  </head>
  <body>
    <div class="bg"></div>
    <div class="rays"></div>
    <div class="particles" id="particles"></div>

    <nav class="nav">
      <a class="nav-brand" href="https://www.out-pace.org/">Outpace</a>
      <div class="nav-links">
        <a class="nav-btn nav-btn-ghost" href="https://www.out-pace.org/">Home</a>
        <a class="nav-btn nav-btn-ghost" href="https://www.out-pace.org/tos">ToS</a>
      </div>
    </nav>

    <div class="page-content">
      <div class="panel">
        <h1>Application</h1>

        <div class="warning">
          Please remember that lying on your application or using any other third-party apps to assist you with your application, specifically AI, your application will be immediately denied.
        </div>

        <form id="staffForm" onsubmit="return handleSubmit(event)">

          <div class="field">
            <label>
              Have you read our <a href="https://www.out-pace.org/tos" target="_blank">Terms and Conditions</a>?
            </label>
            <div class="radio-group">
              <label><input type="radio" name="tos" value="yes" required> Yes</label>
              <label><input type="radio" name="tos" value="no"> No</label>
            </div>
          </div>

          <div class="field">
            <label for="discord">What is your Discord Username?</label>
            <input type="text" id="discord" name="discord" placeholder="username or username#0000" required>
          </div>

          <div class="field">
            <label for="roblox">
              What is your Roblox username? Remember to use your <strong>USERNAME</strong> and not your <strong>DISPLAY NAME</strong>.
            </label>
            <input type="text" id="roblox" name="roblox" placeholder="Your Roblox username" required>
          </div>

          <div class="field">
            <label for="age">How old are you?</label>
            <input type="number" id="age" name="age" min="13" max="99" placeholder="Age" required>
          </div>

          <div class="field">
            <label for="timezone">What is your timezone?</label>
            <select id="timezone" name="timezone" required>
              <option value="" disabled selected>Select timezone</option>
              <option value="UTC-12">UTC−12</option>
              <option value="UTC-11">UTC−11</option>
              <option value="UTC-10">UTC−10 (Hawaii)</option>
              <option value="UTC-9">UTC−9 (Alaska)</option>
              <option value="UTC-8">UTC−8 (Pacific)</option>
              <option value="UTC-7">UTC−7 (Mountain)</option>
              <option value="UTC-6">UTC−6 (Central)</option>
              <option value="UTC-5">UTC−5 (Eastern)</option>
              <option value="UTC-4">UTC−4 (Atlantic)</option>
              <option value="UTC-3">UTC−3</option>
              <option value="UTC-2">UTC−2</option>
              <option value="UTC-1">UTC−1</option>
              <option value="UTC+0">UTC±0 (GMT)</option>
              <option value="UTC+1">UTC+1 (CET)</option>
              <option value="UTC+2">UTC+2</option>
              <option value="UTC+3">UTC+3</option>
              <option value="UTC+4">UTC+4</option>
              <option value="UTC+5">UTC+5</option>
              <option value="UTC+5:30">UTC+5:30 (India)</option>
              <option value="UTC+6">UTC+6</option>
              <option value="UTC+7">UTC+7</option>
              <option value="UTC+8">UTC+8</option>
              <option value="UTC+9">UTC+9 (Japan/Korea)</option>
              <option value="UTC+10">UTC+10</option>
              <option value="UTC+11">UTC+11</option>
              <option value="UTC+12">UTC+12</option>
            </select>
          </div>

          <div class="field">
            <label for="hours">How many hours per week can you dedicate to staff duties?</label>
            <input type="number" id="hours" name="hours" min="1" max="168" placeholder="e.g. 10" required>
          </div>

          <div class="field">
            <label for="role">Which staff role are you most interested in?</label>
            <select id="role" name="role" required>
              <option value="" disabled selected>Select a role</option>
              <option value="moderator">Moderator</option>
              <option value="helper">Helper / Support</option>
              <option value="developer">Developer</option>
              <option value="builder">Builder / Map Designer</option>
              <option value="content">Content Creator</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="field">
            <label for="why">Why do you want to join the Outpace staff team?</label>
            <textarea id="why" name="why" placeholder="Be honest and specific..." required></textarea>
          </div>

          <div class="field">
            <label for="experience">Do you have any previous moderation or staff experience? If yes, describe it.</label>
            <textarea id="experience" name="experience" placeholder="Servers, roles, what you did..." required></textarea>
          </div>

          <div class="field">
            <label>Have you ever been banned, muted, or punished in any Discord server or Roblox game?</label>
            <div class="radio-group">
              <label><input type="radio" name="banned" value="yes" required> Yes</label>
              <label><input type="radio" name="banned" value="no"> No</label>
            </div>
          </div>

          <div class="field">
            <label for="bannedExplain">If yes to the above, explain what happened. If no, type N/A.</label>
            <textarea id="bannedExplain" name="bannedExplain" placeholder="N/A or explanation..." required></textarea>
          </div>

          <div class="field">
            <label for="toxic">A player is being toxic in chat and ignoring warnings. How would you handle it?</label>
            <textarea id="toxic" name="toxic" placeholder="Describe your approach..." required></textarea>
          </div>

          <div class="field">
            <label>Do you have a working microphone and can you join voice chat when needed?</label>
            <div class="radio-group">
              <label><input type="radio" name="mic" value="yes" required> Yes</label>
              <label><input type="radio" name="mic" value="no"> No</label>
            </div>
          </div>

          <div class="field">
            <label for="skills">Do you have any coding, building, design, or content-creation skills that could help the project?</label>
            <textarea id="skills" name="skills" placeholder="e.g. Lua, Blender, Photoshop, video editing..." required></textarea>
          </div>

          <div class="field">
            <label for="scenario">You catch another staff member breaking rules. What do you do?</label>
            <textarea id="scenario" name="scenario" placeholder="Your response..." required></textarea>
          </div>

          <div class="field">
            <label for="availability">What days and times are you usually online?</label>
            <input type="text" id="availability" name="availability" placeholder="e.g. Weekdays 4–10 PM EST, weekends flexible" required>
          </div>

          <div class="field">
            <label for="referral">How did you find out about Outpace / this staff application?</label>
            <input type="text" id="referral" name="referral" placeholder="Discord, friend, Roblox, etc." required>
          </div>

          <div class="field">
            <label for="else">Anything else we should know about you?</label>
            <textarea id="else" name="else" placeholder="Optional, but appreciated"></textarea>
          </div>

          <div class="field">
            <label>
              I confirm this application was written by me, without AI or third-party assistance.
            </label>
            <div class="radio-group">
              <label><input type="radio" name="noAI" value="yes" required> Yes, I confirm</label>
              <label><input type="radio" name="noAI" value="no"> No</label>
            </div>
          </div>

          <div class="btn-row">
            <a class="nav-btn nav-btn-ghost" href="https://www.out-pace.org/">Back</a>
            <button type="submit" class="nav-btn nav-btn-primary">Submit Application</button>
          </div>
        </form>
      </div>
    </div>

    <p id="load">Firebase SDK Loading&hellip;</p>

    <script>
      (function () {
        var el = document.getElementById('particles');
        var frag = document.createDocumentFragment();
        for (var i = 0; i < 18; i++) {
          var s = document.createElement('span');
          var size = 1.5 + Math.random() * 2.5;
          s.style.cssText =
            'left:' + (Math.random() * 100) + '%;' +
            'width:' + size + 'px;height:' + size + 'px;' +
            'animation-duration:' + (10 + Math.random() * 14) + 's;' +
            'animation-delay:' + (Math.random() * 12) + 's;';
          frag.appendChild(s);
        }
        el.appendChild(frag);
      })();

      function handleSubmit(e) {
        e.preventDefault();
        var form = e.target;
        var data = Object.fromEntries(new FormData(form).entries());

        // firebase.firestore().collection('applications').add({
        //   ...data,
        //   submittedAt: firebase.firestore.FieldValue.serverTimestamp()
        // }).then(function () {
        //   window.location.href = 'https://www.out-pace.org/submitted';
        // });

        console.log('Application data:', data);
        window.location.href = 'https://www.out-pace.org/submitted';
        return false;
      }

      document.addEventListener('DOMContentLoaded', function () {
        var loadEl = document.getElementById('load');
        try {
          var app = firebase.app();
          var features = ['auth', 'firestore', 'analytics'].filter(function (f) {
            return typeof app[f] === 'function';
          });
          loadEl.textContent = 'Firebase SDK loaded with ' + features.join(', ');
        } catch (err) {
          console.error(err);
          loadEl.textContent = 'Error loading the Firebase SDK.';
        }
      });
    </script>
  </body>
</html>
