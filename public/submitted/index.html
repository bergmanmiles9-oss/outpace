<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BM</title>
    <meta name="description" content="Backrooms Mania">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script defer src="/__/firebase/12.17.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.17.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.17.0/firebase-database-compat.js"></script>
    <script defer src="/__/firebase/12.17.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/12.17.0/firebase-functions-compat.js"></script>
    <script defer src="/__/firebase/12.17.0/firebase-messaging-compat.js"></script>
    <script defer src="/__/firebase/12.17.0/firebase-storage-compat.js"></script>
    <script defer src="/__/firebase/12.17.0/firebase-analytics-compat.js"></script>
    <script defer src="/__/firebase/12.17.0/firebase-remote-config-compat.js"></script>
    <script defer src="/__/firebase/12.17.0/firebase-performance-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a1810;
        font-family: "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }

      .page {
        position: relative;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .bg {
        position: absolute;
        inset: 0;
        background-image: url('/images/BM.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      .overlay {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at center, transparent 25%, rgba(26, 24, 16, 0.5) 100%),
          linear-gradient(to bottom, rgba(26, 24, 16, 0.2) 0%, rgba(26, 24, 16, 0.45) 100%);
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 2rem 1.5rem;
      }

      .title {
        font-size: clamp(5rem, 18vw, 11rem);
        font-weight: 800;
        letter-spacing: 0.12em;
        line-height: 1;
        color: #f5f0d8;
        text-shadow:
          0 2px 6px rgba(0, 0, 0, 0.7),
          0 0 60px rgba(201, 180, 88, 0.3);
        margin-bottom: 2.5rem;
        opacity: 0;
        transform: translateY(24px);
        animation: rise 1s ease 0.15s forwards;
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.85rem;
        justify-content: center;
        opacity: 0;
        transform: translateY(18px);
        animation: rise 1s ease 0.4s forwards;
      }

      .btn-bm {
        display: inline-block;
        min-width: 140px;
        padding: 0.9rem 1.75rem;
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        border: none;
        transition: background 0.2s, transform 0.15s, box-shadow 0.2s, border-color 0.2s;
      }

      .btn-primary-bm {
        background: #c9b458;
        color: #1a1810;
      }
      .btn-primary-bm:hover {
        background: #e8d98a;
        color: #1a1810;
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(201, 180, 88, 0.4);
      }

      .btn-outline-bm {
        background: rgba(26, 24, 16, 0.45);
        backdrop-filter: blur(6px);
        border: 1.5px solid rgba(232, 217, 138, 0.55);
        color: #f5f0d8;
      }
      .btn-outline-bm:hover {
        background: rgba(201, 180, 88, 0.18);
        border-color: #e8d98a;
        color: #f5f0d8;
        transform: translateY(-2px);
      }

      @keyframes rise {
        to { opacity: 1; transform: translateY(0); }
      }

      #load {
        position: fixed;
        bottom: 0.4rem;
        right: 0.6rem;
        font-size: 0.65rem;
        color: rgba(201, 180, 88, 0.3);
        z-index: 50;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="bg"></div>
      <div class="overlay"></div>

      <div class="content">
        <h1 class="title">Application submitted.</h1>
        <h1 class="title">If your application was denied or accepted. A staff member will DM you..</h1>
        <div class="buttons">
          <a class="btn-bm btn-outline-bm" href="https://www.out-pace.org/">Home</a>
        </div>
      </div>
    </div>

    <p id="load">Firebase SDK Loading&hellip;</p>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const loadEl = document.querySelector('#load');
        try {
          const app = firebase.app();
          const features = [
            'auth', 'database', 'firestore', 'functions',
            'messaging', 'storage', 'analytics', 'remoteConfig', 'performance'
          ].filter((f) => typeof app[f] === 'function');
          loadEl.textContent = `Firebase SDK loaded with ${features.join(', ')}`;
        } catch (err) {
          console.error(err);
          loadEl.textContent = 'Error loading the Firebase SDK.';
        }
      });
    </script>
  </body>
</html>
