<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Outpace — Logs</title>
    <meta name="description" content="Outpace Admin Logs">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
      :root {
        --bg: #07111f;
        --night: #0d2031;
        --text: #eef3fa;
        --dim: #9db0c7;
        --accent: #ffb45e;
        --accent-hi: #ffdca4;
        --accent-ink: #1a0d05;
        --warn: #e0645a;
        --warn-rgb: 224, 100, 90;
        --pine: #6fbf8f;
        --line: rgba(220, 182, 95, 0.16);
        --panel: rgba(9, 22, 38, 0.72);
        --lit: 255, 180, 94;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
      body {
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
        background: linear-gradient(180deg, var(--bg), var(--night)) fixed;
      }

      .glow {
        position: fixed; top: -14%; left: 50%; transform: translateX(-50%);
        width: 900px; max-width: 140vw; height: 640px; z-index: 0; pointer-events: none;
        background: radial-gradient(closest-side, rgba(var(--lit), 0.12), transparent 72%);
      }
      .vignette {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background: radial-gradient(ellipse 88% 68% at 50% 38%, transparent 45%, rgba(3, 9, 20, 0.5) 100%);
      }
      #snow { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

      .app { position: relative; z-index: 2; min-height: 100vh; display: flex; flex-direction: column; }

      /* top bar */
      .topbar {
        position: sticky; top: 0; z-index: 10;
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        padding: 14px clamp(16px, 3vw, 32px);
        border-bottom: 1px solid var(--line);
        background: rgba(7, 17, 31, 0.82);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      }
      .brand {
        font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 1.4rem;
        letter-spacing: 0.02em; text-transform: uppercase; text-decoration: none; color: var(--text);
      }
      .acct {
        display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px;
        border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04);
        font-weight: 500;
      }
      .avatar {
        width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
        background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 0.9rem;
      }

      .shell {
        flex: 1; display: grid; grid-template-columns: 240px minmax(0, 1fr);
        gap: clamp(16px, 2.5vw, 32px); width: 100%; max-width: 1400px; margin: 0 auto;
        padding: clamp(16px, 3vw, 32px) clamp(16px, 3vw, 32px) 48px;
      }

      /* sidebar */
      .side {
        align-self: start; position: sticky; top: 88px;
        display: flex; flex-direction: column; gap: 2px; padding: 10px;
        border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
        backdrop-filter: blur(8px);
      }
      .tab {
        position: relative; display: flex; align-items: center; gap: 12px; width: 100%;
        padding: 11px 12px; border-radius: 8px; color: var(--dim); font-weight: 500;
        text-decoration: none; transition: color 0.2s ease, background 0.2s ease;
      }
      .tab svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .tab:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }
      .tab[aria-current="page"] { color: var(--text); background: rgba(var(--lit), 0.14); }
      .tab[aria-current="page"]::before {
        content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--accent);
      }

      a:focus-visible, button:focus-visible, input:focus-visible {
        outline: 2px solid var(--accent-hi); outline-offset: 2px;
      }

      /* page header */
      .main { min-width: 0; }
      .page-head { margin: 0 0 24px; }
      .page-title {
        margin: 0 0 6px; font-family: 'Big Shoulders Display', sans-serif; font-weight: 700;
        font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: 1; letter-spacing: 0.01em; text-transform: uppercase;
        background: linear-gradient(180deg, var(--accent-hi), var(--accent) 60%, #dcb65f);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .page-sub { margin: 0; color: var(--dim); line-height: 1.5; }

      /* log panel */
      .panel { border: 1px solid var(--line); border-top: 2px solid var(--accent); border-radius: 14px; background: var(--panel); backdrop-filter: blur(8px); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4); overflow: hidden; }

      .console-filters { display: flex; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
      .filter-btn {
        flex: none; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
        background: transparent; color: var(--dim); font: inherit; font-size: 0.88rem; font-weight: 500; cursor: pointer;
        transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      }
      .filter-btn:hover { color: var(--text); border-color: rgba(var(--lit), 0.5); }
      .filter-btn.active { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }

      .console-empty { margin: 0; padding: 56px 24px; text-align: center; color: var(--dim); line-height: 1.6; }
      .console { min-height: 120px; max-height: 55vh; overflow: auto; padding: 8px 0; }
      .console:empty { display: none; }
      .console-line {
        margin: 0; padding: 7px 16px; border-left: 2px solid transparent;
        font-family: var(--mono); font-size: 0.88rem; line-height: 1.55; overflow-wrap: anywhere;
      }
      .console-line[data-priority="high"] { border-left-color: var(--warn); background: rgba(var(--warn-rgb), 0.08); }
      .ts { color: var(--dim); }
      .tag-low { color: var(--pine); }
      .tag-high { color: var(--warn); font-weight: 600; }
      .msg { color: var(--text); }

      /* command prompt at the bottom of the panel */
      .console-cmd { margin: 0; padding: 14px 16px; border-top: 1px solid var(--line); background: rgba(255, 255, 255, 0.02); }
      .cmd-row { display: flex; align-items: center; gap: 10px; }
      .prompt { font-family: var(--mono); font-weight: 700; color: var(--accent); }
      .console-cmd input {
        flex: 1; min-width: 0; padding: 11px 14px; font-family: var(--mono); font-size: 0.92rem; color: var(--text);
        background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); border-radius: 6px; outline: none;
        transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      }
      .console-cmd input::placeholder { color: var(--dim); opacity: 0.75; }
      .console-cmd input:focus-visible { border-color: var(--accent); background: rgba(255, 255, 255, 0.06); box-shadow: 0 0 0 3px rgba(var(--lit), 0.16); }
      .console-cmd input:disabled { opacity: 0.5; cursor: not-allowed; }
      .console-cmd-status { margin: 8px 0 0; font-size: 0.85rem; color: var(--dim); min-height: 1.3em; }

      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

      .drift { flex: none; height: 80px; pointer-events: none; }
      .drift svg { display: block; width: 100%; height: 100%; }

      @media (max-width: 820px) {
        .shell { grid-template-columns: 1fr; }
        .side { position: static; flex-direction: row; overflow-x: auto; }
        .tab { width: auto; flex: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
        #snow { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <canvas id="snow" aria-hidden="true"></canvas>

    <div class="app">
      <header class="topbar">
        <a class="brand" href="/">Outpace</a>
        <div class="acct"><span class="avatar" id="avatar" aria-hidden="true">S</span><span id="acct-name">Staff</span></div>
      </header>

      <div class="shell">
        <nav class="side" aria-label="Dashboard sections">
          <a class="tab" href="/admin">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
            Home
          </a>
          <a class="tab" href="/admin/bans">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>
            Bans
          </a>
          <a class="tab" href="/admin/logs" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/></svg>
            Logs
          </a>
          <a class="tab" href="/admin#wip1">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" stroke-dasharray="3 3"/></svg>
            WIP
          </a>
          <a class="tab" href="/admin#wip2">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" stroke-dasharray="3 3"/></svg>
            WIP
          </a>
          <a class="tab" href="/admin#wip3">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" stroke-dasharray="3 3"/></svg>
            WIP
          </a>
        </nav>

        <main class="main">
          <div class="page-head">
            <h1 class="page-title">Logs</h1>
            <p class="page-sub">Watch live logs and send commands to Roblox Studio.</p>
          </div>

          <section class="panel" aria-label="Logs">
            <div class="console-filters" role="group" aria-label="Filter logs">
              <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">All</button>
              <button type="button" class="filter-btn" data-filter="low" aria-pressed="false">[Low Priority]</button>
              <button type="button" class="filter-btn" data-filter="high" aria-pressed="false">[High Priority]</button>
            </div>

            <p class="console-empty" id="emptyMsg">There are no logs here. Check bans or moderation.</p>

            <div class="console" id="console" aria-live="polite"></div>

            <!-- Command box: sends commands to Roblox through the Cloudflare Worker -->
            <form id="cmdForm" class="console-cmd" autocomplete="off">
              <label class="sr-only" for="cmdInput">Command</label>
              <div class="cmd-row">
                <span class="prompt" aria-hidden="true">&rsaquo;</span>
                <input id="cmdInput" type="text" placeholder='&lt;studcons&gt; print("Testing")'>
              </div>
              <p class="console-cmd-status" id="cmdStatus">Press Enter to send to Roblox Studio.</p>
            </form>
          </section>
        </main>
      </div>

      <div class="drift" aria-hidden="true">
        <svg viewBox="0 0 1440 100" preserveAspectRatio="none"><path d="M0 100 V44 Q140 14 280 40 T560 34 T840 44 T1120 30 T1440 40 V100Z" fill="#c9d8ee"/><path d="M0 100 V62 Q120 36 240 58 T480 54 T720 62 T960 50 T1200 60 T1440 52 V100Z" fill="#f4f8ff"/></svg>
      </div>
    </div>

    <script>
      var logs = [];
      // Example entries (remove or replace with Firestore data):
      // logs = [
      //   { priority: 'low', time: '12:01:03', message: 'Player Steve joined the game' },
      //   { priority: 'high', time: '12:02:11', message: 'Unauthorized access attempt from 192.168.1.4' }
      // ];

      var consoleEl = document.getElementById('console');
      var emptyMsg = document.getElementById('emptyMsg');
      var currentFilter = 'all';

      function renderLogs() {
        consoleEl.innerHTML = '';
        var visible = 0;

        logs.forEach(function (log) {
          if (currentFilter !== 'all' && log.priority !== currentFilter) return;
          visible++;

          var line = document.createElement('p');
          line.className = 'console-line';
          line.dataset.priority = log.priority;

          var isHigh = log.priority === 'high';

          var ts = document.createElement('span');
          ts.className = 'ts';
          ts.textContent = '[' + log.time + ']';

          var tag = document.createElement('span');
          tag.className = isHigh ? 'tag-high' : 'tag-low';
          tag.textContent = isHigh ? '[High Priority]' : '[Low Priority]';

          // textContent (not innerHTML) so a log message can never inject HTML/script
          var msg = document.createElement('span');
          msg.className = 'msg';
          msg.textContent = log.message;

          line.appendChild(ts);
          line.appendChild(document.createTextNode(' '));
          line.appendChild(tag);
          line.appendChild(document.createTextNode(' '));
          line.appendChild(msg);

          consoleEl.appendChild(line);
        });

        emptyMsg.style.display = visible === 0 ? 'block' : 'none';
      }

      document.querySelectorAll('.filter-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.filter-btn').forEach(function (b) {
            b.classList.remove('active');
            b.setAttribute('aria-pressed', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-pressed', 'true');
          currentFilter = btn.getAttribute('data-filter');
          renderLogs();
        });
      });

      renderLogs();

      // Live updates: call addLog('low' | 'high', 'message')
      function addLog(priority, message) {
        var now = new Date();
        var t = [now.getHours(), now.getMinutes(), now.getSeconds()]
          .map(function (n) { return String(n).padStart(2, '0'); }).join(':');
        logs.push({ priority: priority, time: t, message: message });
        renderLogs();
      }

      // ---- studcons command box ----
      var WORKER_URL = 'https://studcons.bergmanmiles9.workers.dev';

      (function () {
        var form = document.getElementById('cmdForm');
        var input = document.getElementById('cmdInput');
        var status = document.getElementById('cmdStatus');

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var text = input.value.trim();
          if (!text) return;

          input.disabled = true;
          status.textContent = 'Sending…';

          fetch(WORKER_URL + '/command', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text })
          }).then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
          }).then(function () {
            addLog('low', 'Sent: ' + text);
            input.value = '';
            status.textContent = 'Sent.';
          }).catch(function (err) {
            console.error(err);
            addLog('high', 'Command failed: ' + err.message);
            status.textContent = 'Failed to send. Check the browser console and your Worker settings.';
          }).then(function () {
            input.disabled = false;
            input.focus();
          });
        });
      })();

      // ---- signed-in name in the top bar ----
      fetch('/api/me', { credentials: 'same-origin' })
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (u) {
          if (!u || !u.username) return;
          document.getElementById('acct-name').textContent = u.username;
          document.getElementById('avatar').textContent = u.username.charAt(0).toUpperCase();
        })
        .catch(function () {});

      // ---- snowfall ----
      (function () {
        var canvas = document.getElementById('snow');
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduceMotion || !canvas.getContext) return;
        var ctx = canvas.getContext('2d');
        var flakes = [], w = 0, h = 0, dpr = 1;

        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = canvas.width = window.innerWidth * dpr;
          h = canvas.height = window.innerHeight * dpr;
        }
        function makeFlake(anywhere) {
          var r = (Math.random() * 2 + 0.6) * dpr;
          return { x: Math.random() * w, y: anywhere ? Math.random() * h : -10, r: r,
                   vy: (r / dpr * 0.3 + 0.3) * dpr, p: Math.random() * 6.28, a: Math.random() * 0.4 + 0.25 };
        }
        function seed() {
          flakes = [];
          for (var i = 0; i < 90; i++) flakes.push(makeFlake(true));
        }
        function frame() {
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = '#fff';
          for (var i = 0; i < flakes.length; i++) {
            var f = flakes[i];
            f.p += 0.012; f.y += f.vy; f.x += Math.sin(f.p) * 0.4 * dpr;
            if (f.y > h + 10) { flakes[i] = makeFlake(false); continue; }
            ctx.globalAlpha = f.a;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            ctx.fill();
          }
          requestAnimationFrame(frame);
        }
        resize(); seed(); frame();
        window.addEventListener('resize', function () { resize(); seed(); });
      })();
    </script>
  </body>
</html>
