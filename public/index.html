<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Outpace (Discontinued or sum)</title>
    <meta name="description" content="Outpace">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="bg"></div>
    <div class="rays"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="particles" id="particles"></div>
    <div class="vignette"></div>
    <div class="noise"></div>

    <nav class="nav">
      <a class="nav-brand" href="https://www.out-pace.org/">Outpace (Discontinued or sum)</a>
      <div class="nav-links">
        <a class="nav-btn nav-btn-ghost" href="https://discord.gg/ZzWwDURXhG" target="_blank" rel="noopener">Discord</a>
        <a class="nav-btn nav-btn-ghost" href="https://www.out-pace.org/releasedate">Release (idk)</a>
        <a class="nav-btn nav-btn-primary" href="https://www.out-pace.org/apply">Dont (Apply for Staff) Rn</a>
      </div>
    </nav>

    <main class="main">
      <div>
        <h1 class="landing-title">Outpace (Discontinued or sum)</h1>
        <p class="landing-sub">Outpace (Discontinued or sum)</p>
        <div class="landing-buttons">
          <a class="nav-btn nav-btn-primary" href="https://discord.gg/ZzWwDURXhG" target="_blank" rel="noopener">Discord</a>
          <a class="nav-btn nav-btn-ghost" href="https://www.out-pace.org/releasedate">Release (idk)</a>
          <a class="nav-btn nav-btn-ghost" href="https://www.out-pace.org/apply">Dont Apply for Staff Rn</a>
        </div>
      </div>
    </main>

    <script>
      (function () {
        var el = document.getElementById('particles');
        var frag = document.createDocumentFragment();
        for (var i = 0; i < 28; i++) {
          var s = document.createElement('span');
          var size = 1.5 + Math.random() * 3;
          s.style.cssText =
            'left:' + (Math.random() * 100) + '%;' +
            'width:' + size + 'px;height:' + size + 'px;' +
            'animation-duration:' + (9 + Math.random() * 16) + 's;' +
            'animation-delay:' + (Math.random() * 12) + 's;';
          frag.appendChild(s);
        }
        el.appendChild(frag);
      })();
    </script>
  </body>
</html>
