<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outpace</title>
<meta name="description" content="Outpace — outrun what's behind the door.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js');</script>
<style>
:root {
  --bg: #08090b;
  --line: rgba(255,255,255,0.055);
  --text: #ece9e4;
  --text-dim: #85888e;
  --accent: #c9553c;
  --accent-hot: #e8845f;
  --accent-ink: #180a06;
  --mx: 50%; --my: 38%;
  --px: 0; --py: 0;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
body { min-height: 100vh; position: relative; }
.layer { position: fixed; inset: 0; pointer-events: none; }

/* corridor seams, plus a brighter copy that only shows under the cursor */
.corridor, .corridor-lit {
  z-index: 0;
  background-image: repeating-linear-gradient(90deg, var(--line) 0, var(--line) 1px, transparent 1px, transparent 130px);
  -webkit-mask-image: radial-gradient(ellipse 85% 65% at 50% 35%, #000 20%, transparent 85%);
  mask-image: radial-gradient(ellipse 85% 65% at 50% 35%, #000 20%, transparent 85%);
}
.corridor-lit {
  background-image: repeating-linear-gradient(90deg, rgba(232,132,95,0.55) 0, rgba(232,132,95,0.55) 1px, transparent 1px, transparent 130px);
  -webkit-mask-image: radial-gradient(circle 230px at var(--mx) var(--my), #000, transparent 100%);
  mask-image: radial-gradient(circle 230px at var(--mx) var(--my), #000, transparent 100%);
}
.torch {
  z-index: 1;
  background: radial-gradient(circle 340px at var(--mx) var(--my), rgba(201,85,60,0.09), transparent 100%);
}
.glow {
  z-index: 0; top: -25%; left: 50%; right: auto; bottom: auto;
  width: 900px; height: 680px; max-width: 140vw;
  transform: translateX(-50%) translate(calc(var(--px) * -26px), calc(var(--py) * -16px));
  background: radial-gradient(closest-side, rgba(201,85,60,0.17), transparent 72%);
  animation: breathe 7s ease-in-out infinite;
}
@keyframes breathe { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
.vignette { z-index: 3; background: radial-gradient(ellipse 88% 68% at 50% 38%, transparent 42%, rgba(0,0,0,0.78) 100%); }
#dust { z-index: 1; width: 100%; height: 100%; }

/* the maintenance hallway: the mangled worker waits at the far end */
.scene { z-index: 1; width: 100%; height: 100%; opacity: 0;
  transform: translate(calc(var(--px) * 10px), calc(var(--py) * 6px)) scale(1.06);
  animation: frameIn 1.4s ease .1s forwards; }
@keyframes frameIn { to { opacity: 1; } }
.lamps { animation: hum 9s linear 4s infinite; }
.lamp { fill: #efe6d6; opacity: 0; filter: drop-shadow(0 0 1.4px rgba(255,236,200,.9));
  animation: lampOn 1s forwards; animation-delay: calc(.7s + var(--k) * .35s); }
@keyframes lampOn { 0% { opacity: 0; } 20% { opacity: .9; } 32% { opacity: .1; } 50% { opacity: .9; } 62% { opacity: .3; } 100% { opacity: .95; } }
@keyframes hum { 0%,100% { opacity: 1; } 91% { opacity: 1; } 92% { opacity: .35; } 93% { opacity: 1; } 94% { opacity: .6; } 95% { opacity: 1; } }
.exit { animation: breathe 5s ease-in-out infinite; }
.arr { fill: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round; opacity: .12;
  animation: run 1.8s ease-in-out infinite; animation-delay: calc(2s + var(--k) * .22s); }
@keyframes run { 0%,100% { opacity: .12; } 30% { opacity: .95; } }
.figure { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%;
  animation: frameIn 1.6s ease 2.8s forwards, sway 5s ease-in-out 2.8s infinite alternate; }
@keyframes sway { from { transform: rotate(-1.4deg); } to { transform: rotate(1.4deg); } }
.loom { transform-box: fill-box; transform-origin: 50% 100%; animation: loom 18s linear 6s infinite; }
@keyframes loom { 0%,96% { transform: scale(1); } 96.4%,98.8% { transform: scale(1.4); } 99.2%,100% { transform: scale(1); } }
.head { transform-box: fill-box; transform-origin: 50% 100%; animation: twitch 7s steps(1) infinite; }
@keyframes twitch { 0%,86% { transform: none; } 87% { transform: rotate(9deg) translateY(1px); } 88% { transform: rotate(-6deg); } 89%,100% { transform: none; } }
.eye { fill: var(--accent-hot); filter: drop-shadow(0 0 3px var(--accent-hot)); animation: eyes 7s steps(1) infinite; }
@keyframes eyes { 0%,40% { opacity: .15; } 41%,70% { opacity: 1; } 71%,80% { opacity: .15; } 81%,100% { opacity: .9; } }

/* a crack across the screen now and then, like the trailer */
.crack { z-index: 4; width: 100%; height: 100%; opacity: 0; animation: crack 18s linear 6s infinite; }
.crack polyline { fill: none; stroke: var(--accent-hot); stroke-width: 1.5; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 6px rgba(232,132,95,.8)); }
@keyframes crack {
  0%,96% { opacity: 0; } 96.4% { opacity: 1; } 96.8% { opacity: 0; }
  97.2% { opacity: .8; } 98.4% { opacity: .8; } 98.8% { opacity: 0; } 100% { opacity: 0; }
}

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px clamp(20px, 5vw, 56px);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  background: linear-gradient(to bottom, rgba(8,9,11,0.9), rgba(8,9,11,0));
  opacity: 0; animation: frameIn .9s ease 2.2s forwards;
}
.nav-brand { font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 1.4rem; letter-spacing: .02em; color: var(--text); text-decoration: none; text-transform: uppercase; }
.nav-links { display: flex; gap: 10px; }

.btn {
  position: relative; overflow: hidden;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 10px 18px; border-radius: 6px;
  font-size: .92rem; font-weight: 500; text-decoration: none; white-space: nowrap;
  transition: border-color .2s, background .2s, transform .15s, box-shadow .25s;
}
.btn::after { /* light sweeping across on hover */
  content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.22), transparent);
  transform: skewX(-18deg); transition: left .55s ease;
}
.btn:hover::after { left: 130%; }
.btn:focus-visible { outline: 2px solid var(--accent-hot); outline-offset: 2px; }
.btn-ghost { color: var(--text); border: 1px solid var(--line); background: rgba(255,255,255,.02); }
.btn-ghost:hover { border-color: rgba(232,132,95,.55); background: rgba(201,85,60,.07); }
.btn-primary { color: var(--accent-ink); background: var(--accent); border: 1px solid var(--accent); }
.btn-primary:hover { background: var(--accent-hot); transform: translateY(-1px); box-shadow: 0 8px 30px rgba(201,85,60,.4); }

main { position: relative; z-index: 5; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 17vh 24px 80px; }
.hero { text-align: center; max-width: 680px; }

.landing-title {
  position: relative; display: inline-block;
  font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
  font-size: clamp(3.8rem, 12vw, 7.6rem); line-height: .92; letter-spacing: .02em;
  text-transform: uppercase; margin: 0 0 18px; color: var(--text);
  text-shadow: 0 2px 40px rgba(0,0,0,.7);
}
.landing-title .ch { display: inline-block; }
.js .landing-title .ch { opacity: 0; transform: translateY(40%); filter: blur(8px); animation: letter .9s cubic-bezier(.16,1,.3,1) forwards; animation-delay: calc(1.3s + var(--i) * 80ms); }
@keyframes letter { to { opacity: 1; transform: none; filter: blur(0); } }
.landing-title::before, .landing-title::after {
  content: attr(data-text); position: absolute; inset: 0; opacity: 0; pointer-events: none;
  animation: glitch 18s linear 6s infinite;
}
.landing-title::before { color: var(--accent-hot); }
.landing-title::after { color: #7fb4c9; animation-name: glitch2; }
@keyframes glitch {
  0%,96% { opacity: 0; } 96.4% { opacity: .9; clip-path: inset(10% 0 62% 0); transform: translateX(-6px); }
  96.8% { opacity: .9; clip-path: inset(58% 0 12% 0); transform: translateX(5px); }
  97.2%,100% { opacity: 0; }
}
@keyframes glitch2 {
  0%,96.2% { opacity: 0; } 96.6% { opacity: .6; clip-path: inset(40% 0 35% 0); transform: translateX(7px); }
  97% { opacity: 0; } 100% { opacity: 0; }
}

.landing-sub { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: clamp(1rem, 2vw, 1.15rem); color: var(--text-dim); margin: 0 0 40px; line-height: 1.5; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(201,85,60,.6); animation: pulse 2.2s ease-out infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(201,85,60,0); } 100% { box-shadow: 0 0 0 0 rgba(201,85,60,0); } }

.landing-buttons { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; }
.landing-buttons .btn { padding: 12px 22px; font-size: .95rem; }

.reveal { opacity: 0; transform: translateY(12px); animation: rise .9s cubic-bezier(.16,1,.3,1) forwards; }
.reveal.d1 { animation-delay: 2.1s; } .reveal.d2 { animation-delay: 2.35s; }
@keyframes rise { to { opacity: 1; transform: none; } }

@media (max-width: 560px) {
  .nav-links { gap: 6px; } .btn { padding: 8px 12px; font-size: .82rem; }
  .landing-buttons { flex-direction: column; width: 100%; }
  .landing-buttons .btn { width: 100%; }
  .torch { display: none; }
  .scene { top: 8vh; bottom: -8vh; height: auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .scene, .figure, .lamp, nav, .reveal { opacity: 1; transform: none; }
  .arr { opacity: .6; }
  .js .landing-title .ch { opacity: 1; transform: none; filter: none; }
  .crack, #dust { display: none; }
}
</style>
</head>
<body>
<div class="layer glow" aria-hidden="true"></div>
<canvas id="dust" class="layer" aria-hidden="true"></canvas>
<svg class="layer scene" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="wl" x1="0" x2="1"><stop offset="0" stop-color="#15171b"/><stop offset="1" stop-color="#07080a"/></linearGradient>
    <linearGradient id="wr" x1="1" x2="0"><stop offset="0" stop-color="#15171b"/><stop offset="1" stop-color="#07080a"/></linearGradient>
    <linearGradient id="cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0e11"/><stop offset="1" stop-color="#050506"/></linearGradient>
    <linearGradient id="fl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#101216"/><stop offset="1" stop-color="#050506"/></linearGradient>
    <radialGradient id="pool"><stop offset="0" stop-color="#e8845f" stop-opacity=".2"/><stop offset="1" stop-color="#e8845f" stop-opacity="0"/></radialGradient>
  </defs>
  <polygon points="0,0 41,54 41,76 0,100" fill="url(#wl)"/>
  <polygon points="100,0 59,54 59,76 100,100" fill="url(#wr)"/>
  <polygon points="0,0 100,0 59,54 41,54" fill="url(#cl)"/>
  <polygon points="0,100 100,100 59,76 41,76" fill="url(#fl)"/>
  <rect x="41" y="54" width="18" height="22" fill="#060607"/>
  <rect class="exit" x="46.8" y="58" width="6.4" height="18" fill="#1a0d09" stroke="#c9553c" stroke-width=".25"/>
  <g fill="none" stroke="rgba(255,255,255,.06)" stroke-width=".15">
    <polyline points="0,0 41,54"/><polyline points="100,0 59,54"/><polyline points="0,100 41,76"/><polyline points="100,100 59,76"/>
    <rect x="41" y="54" width="18" height="22"/>
  </g>
  <g fill="#1b1512" stroke="rgba(201,85,60,.25)" stroke-width=".12">
    <polygon points="0,15 0,19 41,57.6 41,58.6"/><polygon points="0,26 0,29.5 41,61 41,61.8"/>
    <polygon points="100,15 100,19 59,57.6 59,58.6"/><polygon points="100,26 100,29.5 59,61 59,61.8"/>
  </g>
  <ellipse cx="50" cy="90" rx="30" ry="8" fill="url(#pool)"/>
  <g class="lamps">
    <rect class="lamp" style="--k:3" x="43" y="10.5" width="14" height="2.6" rx=".3"/>
    <rect class="lamp" style="--k:2" x="45.5" y="26" width="9" height="1.8" rx=".2"/>
    <rect class="lamp" style="--k:1" x="47" y="38" width="6" height="1.2" rx=".2"/>
    <rect class="lamp" style="--k:0" x="48" y="46" width="4" height=".8" rx=".2"/>
  </g>
  <g stroke-width="1">
    <polyline class="arr" style="--k:0" points="48,77.1 50,78.5 52,77.1" stroke-width=".5"/>
    <polyline class="arr" style="--k:1" points="46,82.1 50,84.5 54,82.1" stroke-width=".8"/>
    <polyline class="arr" style="--k:2" points="43,87.6 50,91.6 57,87.6" stroke-width="1.2"/>
    <polyline class="arr" style="--k:3" points="39,92 50,98 61,92" stroke-width="1.8"/>
  </g>
  <g class="figure"><g class="loom"><g transform="translate(43.5 50) scale(.065)" fill="#020203" stroke="rgba(232,132,95,.35)" stroke-width="1.4">
    <path d="M82 205 L74 330 L90 400 L106 400 L100 320 L110 210 Z"/>
    <path d="M112 208 L124 300 L120 400 L138 400 L144 296 L130 204 Z"/>
    <path d="M70 98 Q36 150 50 236 L40 312 L50 324 L58 314 L64 324 L72 312 L72 236 Q86 176 90 120 Z"/>
    <path d="M68 90 Q100 76 134 94 L148 192 Q122 218 96 212 L72 202 Z"/>
    <path d="M130 98 Q162 92 172 64 L182 70 Q174 112 140 128 Z"/>
    <line x1="176" y1="72" x2="198" y2="-6" stroke="#18110e" stroke-width="9"/>
    <g class="head">
      <ellipse cx="99" cy="68" rx="16" ry="19" transform="rotate(-14 99 68)"/>
      <path d="M76 54 Q98 26 122 48 L128 56 L70 60 Z"/>
      <circle class="eye" cx="93" cy="68" r="2.6" stroke="none"/><circle class="eye" cx="106" cy="64" r="2.6" stroke="none"/>
    </g>
  </g></g></g>
</svg>
<div class="layer torch" aria-hidden="true"></div>
<div class="layer vignette" aria-hidden="true"></div>
<svg class="layer crack" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
  <polyline points="56,0 52,14 58,27 49,41 55,55 47,70 53,84 50,100"/>
</svg>

<nav>
  <a class="nav-brand" href="https://www.out-pace.org/">Outpace</a>
  <div class="nav-links">
    <a class="btn btn-ghost" href="https://discord.gg/ZzWwDURXhG" target="_blank" rel="noopener">Discord</a>
    <a class="btn btn-ghost" href="https://www.out-pace.org/releasedate">Release</a>
    <a class="btn btn-primary" href="https://www.out-pace.org/apply">Apply for Staff</a>
  </div>
</nav>

<main>
  <div class="hero">
    <h1 class="landing-title" id="title" data-text="Outpace" aria-label="Outpace">Outpace</h1>
    <p class="landing-sub reveal d1"><span class="dot" aria-hidden="true"></span>Currently in development.</p>
    <div class="landing-buttons reveal d2">
      <a class="btn btn-primary" href="https://discord.gg/ZzWwDURXhG" target="_blank" rel="noopener">Discord</a>
      <a class="btn btn-ghost" href="https://www.out-pace.org/releasedate">Release</a>
      <a class="btn btn-ghost" href="https://www.out-pace.org/apply">Apply for Staff</a>
    </div>
  </div>
</main>

<script>
(function () {
  var root = document.documentElement;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // split the title into letters for the staggered reveal
  var t = document.getElementById('title');
  var word = t.textContent;
  t.textContent = '';
  word.split('').forEach(function (c, i) {
    var s = document.createElement('span');
    s.className = 'ch'; s.textContent = c; s.style.setProperty('--i', i); s.setAttribute('aria-hidden', 'true');
    t.appendChild(s);
  });

  // flashlight + gentle parallax that follow the cursor
  var tx = 0.5, ty = 0.38, cx = tx, cy = ty;
  window.addEventListener('pointermove', function (e) {
    tx = e.clientX / window.innerWidth; ty = e.clientY / window.innerHeight;
  }, { passive: true });
  function follow() {
    cx += (tx - cx) * 0.08; cy += (ty - cy) * 0.08;
    root.style.setProperty('--mx', (cx * 100).toFixed(2) + '%');
    root.style.setProperty('--my', (cy * 100).toFixed(2) + '%');
    root.style.setProperty('--px', (cx - 0.5).toFixed(3));
    root.style.setProperty('--py', (cy - 0.5).toFixed(3));
    requestAnimationFrame(follow);
  }
  if (!reduce) follow();

  // slow drifting dust caught in the light
  var cv = document.getElementById('dust');
  if (reduce || !cv.getContext) return;
  var ctx = cv.getContext('2d'), w, h, dpr, motes = [];
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = cv.width = innerWidth * dpr; h = cv.height = innerHeight * dpr;
  }
  function make() {
    return { x: Math.random() * w, y: Math.random() * h, r: (Math.random() * 1.4 + 0.4) * dpr,
             vy: -(Math.random() * 0.12 + 0.03) * dpr, vx: (Math.random() - 0.5) * 0.08 * dpr,
             a: Math.random() * 0.45 + 0.1, p: Math.random() * 6.28 };
  }
  size(); for (var i = 0; i < 70; i++) motes.push(make());
  addEventListener('resize', size);
  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i]; m.x += m.vx; m.y += m.vy; m.p += 0.01;
      if (m.y < -5) { m.y = h + 5; m.x = Math.random() * w; }
      // brighter the closer to the door's light
      var d = Math.abs(m.x - w / 2) / (w / 2), glow = Math.max(0.2, 1 - d);
      ctx.globalAlpha = m.a * glow * (0.6 + 0.4 * Math.sin(m.p));
      ctx.fillStyle = '#f0b08c';
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
