<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outpace</title>
<meta name="description" content="Outpace — escape the maintenance halls before the worker finds you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!-- CHRISTMAS SWITCH: remove 'xmas' below to turn the whole Christmas theme off -->
<script>document.documentElement.classList.add('xmas');</script>
<style>
:root {
  --ink: #08090b; --night: #121316;
  --text: #ece9e4; --dim: #9096a0;
  --light: #e8845f; --light-hot: #ffb48c; --lit: 232,132,95;
  --accent-ink: #1a0d05; --gold: #c9a24f;
  --line: rgba(255,255,255,.14);
  --pad: clamp(20px, 5vw, 64px);
  --rx: clamp(24px, 9vw, 140px);
  --floor-h: clamp(250px, 36vh, 340px);
  --lamp-y: clamp(70px, 16vh, 170px);
}
/* Christmas theme: only colors change here; extra decorations are .xmas-only */
html.xmas {
  --ink: #07111f; --night: #0d2031;
  --text: #eef3fa; --dim: #9db0c7;
  --light: #ffb45e; --light-hot: #ffdca4; --lit: 255,180,94;
  --gold: #dcb65f;
  --line: rgba(220,182,95,.22);
}
html:not(.xmas) .xmas-only { display: none !important; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--ink); color: var(--text); font-family: 'IBM Plex Sans', system-ui, sans-serif; line-height: 1.5; overflow-x: hidden; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--light-hot); outline-offset: 3px; }
#snow { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
html:not(.xmas) #snow { display: none; }

/* nav */
nav { position: fixed; inset: 0 0 auto 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 18px var(--pad); background: linear-gradient(var(--ink), transparent); }
.brand { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 1.5rem; text-transform: uppercase; text-decoration: none; }
.nav-links { display: flex; gap: 10px; }
.btn { display: inline-flex; align-items: center; padding: 11px 20px; border: 1px solid var(--line); border-radius: 2px; font-size: .95rem; font-weight: 500; text-decoration: none; white-space: nowrap; color: var(--text); transition: background .2s, border-color .2s, color .2s; }
.btn:hover { border-color: var(--light); color: var(--light-hot); }
.btn-primary { background: var(--light); border-color: var(--light); color: var(--accent-ink); }
.btn-primary:hover { background: var(--light-hot); border-color: var(--light-hot); color: var(--accent-ink); }

/* hero: a caged maintenance lamp flickers on over the floor line the title stands on */
.hero { position: relative; min-height: 100svh; display: flex; flex-direction: column; padding: 0 var(--pad); overflow: hidden; background: linear-gradient(180deg, var(--ink), var(--night)); }
.hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 40% 60% at calc(100% - var(--rx) - clamp(140px, 21vw, 310px)) 30%, rgba(var(--lit), .15), transparent 70%); }
.hero-top { position: relative; z-index: 3; flex: 1; display: flex; align-items: flex-end; padding-top: 90px; }
.title { display: inline-block; margin: 0; padding: 0 .06em .03em 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: clamp(5rem, 22vw, 20rem); line-height: .78; text-transform: uppercase; letter-spacing: .01em; transform: skewX(-7deg); transform-origin: 0 100%; text-shadow: 0 0 80px rgba(var(--lit), .22); animation: write 1.1s cubic-bezier(.7, 0, .2, 1) 1.2s backwards; }
.hero-bottom { position: relative; z-index: 3; height: var(--floor-h); border-top: 1px solid var(--line); padding-top: clamp(18px, 3vh, 32px); }
.hero-bottom > * { animation: rise .9s ease 1.9s backwards; }
.tagline { margin: 0 0 10px; font-size: clamp(1.25rem, 2.6vw, 1.75rem); font-weight: 500; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 22px; margin: 0 0 24px; color: var(--dim); }
.dot { display: inline-block; width: 7px; height: 7px; margin-right: 10px; border-radius: 50%; background: var(--light); }
.countdown { color: var(--gold); }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; }
/* the lamp */
.lamp { --w: clamp(280px, 42vw, 620px); --sw: clamp(72px, 8vw, 110px); position: absolute; top: 0; right: var(--rx); width: var(--w); height: calc(100% - var(--floor-h) * .3); z-index: 1; pointer-events: none; }
.cord { position: absolute; left: 50%; top: 0; width: 2px; height: var(--lamp-y); margin-left: -1px; background: #000; }
.shade { position: absolute; left: 50%; top: var(--lamp-y); width: var(--sw); height: calc(var(--sw) * .48); margin-left: calc(var(--sw) / -2); border-radius: 50% 50% 6px 6px / 100% 100% 6px 6px; background: linear-gradient(180deg, #4a4e57, #1c1d21); }
.bulb { position: absolute; left: 50%; top: calc(var(--lamp-y) + var(--sw) * .48 - 4px); width: calc(var(--sw) * .5); height: 10px; margin-left: calc(var(--sw) / -4); border-radius: 50%; background: var(--light-hot); box-shadow: 0 0 40px 14px rgba(var(--lit), .6); animation: flick 1.7s linear .4s backwards; }
.cone { position: absolute; inset: calc(var(--lamp-y) + var(--sw) * .48) 0 0 0; background: linear-gradient(180deg, rgba(var(--lit), .4), rgba(var(--lit), .03)); clip-path: polygon(calc(50% - var(--sw) / 4) 0, calc(50% + var(--sw) / 4) 0, 100% 100%, 0 100%); animation: flick 1.7s linear .4s backwards; }
@keyframes flick { 0%, 14% { opacity: 0; } 16% { opacity: .9; } 20% { opacity: .05; } 26% { opacity: 1; } 32% { opacity: .35; } 38%, 100% { opacity: 1; } }
@keyframes write { from { clip-path: inset(0 100% 0 0); } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

/* team: a plain roster; the row under your cursor is lit like the hall lamp */
.team { position: relative; z-index: 3; padding: clamp(72px, 12vh, 140px) var(--pad) clamp(170px, 24vh, 260px); background: var(--night); }
html:not(.xmas) .team { padding-bottom: 96px; }
.team-inner { max-width: 1100px; }
.team-title { margin: 0 0 clamp(36px, 6vh, 64px); font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: clamp(2.8rem, 7vw, 5.2rem); line-height: .95; text-transform: uppercase; }
.roster { list-style: none; margin: 0; padding: 0; }
.mem { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding: 26px 0 26px 22px; border-bottom: 1px solid var(--line); transition: background .3s; }
.mem:first-child { border-top: 1px solid var(--line); }
.mem:hover { background: linear-gradient(90deg, rgba(var(--lit), .14), transparent 70%); }
.m-name { font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1; transition: transform .3s, color .3s; }
.mem:hover .m-name { color: var(--light-hot); transform: translateX(10px); }
.m-role { color: var(--dim); text-align: right; max-width: 34ch; line-height: 1.4; }
.join { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; margin-top: clamp(48px, 8vh, 88px); color: var(--dim); }
.drift { position: absolute; left: 0; right: 0; bottom: 0; height: 100px; pointer-events: none; }
.drift svg { display: block; width: 100%; height: 100%; }

@media (max-width: 560px) {
  .nav-links { gap: 6px; } .nav-links .btn { padding: 8px 12px; font-size: .82rem; }
  .cta-row .btn-ghost { display: none; }
  .mem { flex-direction: column; gap: 6px; }
  .m-role { text-align: left; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  #snow { display: none; }
}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>

<nav>
  <a class="brand" href="https://www.out-pace.org/">Outpace</a>
  <div class="nav-links">
    <a class="btn" href="https://discord.gg/ZzWwDURXhG" target="_blank" rel="noopener">Discord</a>
    <a class="btn" href="https://www.out-pace.org/releasedate">Release</a>
    <a class="btn btn-primary" href="https://www.out-pace.org/apply">Apply for Staff</a>
  </div>
</nav>

<header class="hero">
  <div class="lamp" aria-hidden="true"><div class="cone"></div><div class="cord"></div><div class="shade"></div><div class="bulb"></div></div>
  <div class="hero-top"><h1 class="title">Outpace</h1></div>
  <div class="hero-bottom">
    <p class="tagline">Escape the maintenance halls before the worker finds you.</p>
    <p class="status"><span><span class="dot" aria-hidden="true"></span>Currently in development.</span><strong class="countdown xmas-only">Christmas Update</strong><span class="xmas-only" id="countdown"></span></p>
    <div class="cta-row">
      <a class="btn btn-primary" href="https://discord.gg/ZzWwDURXhG" target="_blank" rel="noopener">Discord</a>
      <a class="btn btn-ghost" href="https://www.out-pace.org/releasedate">Release</a>
      <a class="btn btn-ghost" href="https://www.out-pace.org/apply">Apply for Staff</a>
    </div>
  </div>
</header>

<section class="team" aria-labelledby="team-h">
  <div class="team-inner">
    <h2 class="team-title" id="team-h">The team</h2>
    <ul class="roster" id="roster"></ul>
    <div class="join"><span>Want to help build Outpace?</span><a class="btn btn-primary" href="https://www.out-pace.org/apply">Apply for Staff</a></div>
  </div>
  <div class="drift xmas-only" aria-hidden="true"><svg viewBox="0 0 1440 100" preserveAspectRatio="none"><path d="M0 100 V44 Q140 14 280 40 T560 34 T840 44 T1120 30 T1440 40 V100Z" fill="#c9d8ee"/><path d="M0 100 V62 Q120 36 240 58 T480 54 T720 62 T960 50 T1200 60 T1440 52 V100Z" fill="#f4f8ff"/></svg></div>
</section>

<script>
(function () {
  var root = document.documentElement;
  var xmas = root.classList.contains('xmas');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ===== STAFF LIST: edit here. One line per person, in the order shown. =====
  var STAFF = [
    { name: 'Vulzure',     role: 'Main Founder, Lead Developer' },
    { name: 'Cashier Dev', role: 'Co Founder, Lead modeler' },
    { name: 'Motorzway',   role: 'Lighting Dev Specialist' },
    { name: 'Jxxmolo',     role: 'Outpace Manager' },
    { name: 'PaperMation', role: 'Artist' }
  ];
  // ==========================================================================
  function el(tag, cls, text) {
    var e = document.createElement(tag); e.className = cls;
    if (text) e.textContent = text; return e;
  }
  var roster = document.getElementById('roster');
  STAFF.forEach(function (m) {
    var li = el('li', 'mem');
    li.appendChild(el('span', 'm-name', m.name));
    li.appendChild(el('span', 'm-role', m.role));
    roster.appendChild(li);
  });
  if (xmas) document.getElementById('team-h').textContent = 'The Christmas crew';

  // days until Christmas
  var cd = document.getElementById('countdown');
  if (cd) {
    var n = new Date(), d = Math.ceil((new Date(n.getFullYear(), 11, 25) - n) / 864e5);
    cd.textContent = d > 1 ? d + ' days until Christmas' : d === 1 ? 'Christmas is tomorrow' : 'Merry Christmas';
  }

  // snow
  var cv = document.getElementById('snow');
  if (!xmas || reduce || !cv.getContext) return;
  var c = cv.getContext('2d'), w, h, dpr, fl = [];
  function size() { dpr = Math.min(window.devicePixelRatio || 1, 2); w = cv.width = innerWidth * dpr; h = cv.height = innerHeight * dpr; }
  function mk(top) {
    var r = (Math.random() * 2 + .6) * dpr;
    return { x: Math.random() * w, y: top ? -10 : Math.random() * h, r: r, vy: (r / dpr * .3 + .3) * dpr, p: Math.random() * 6.28, a: Math.random() * .4 + .3 };
  }
  size(); for (var i = 0; i < 110; i++) fl.push(mk(false));
  addEventListener('resize', size);
  (function draw() {
    c.clearRect(0, 0, w, h); c.fillStyle = '#fff';
    for (var j = 0; j < fl.length; j++) {
      var s = fl[j]; s.p += .012; s.y += s.vy; s.x += Math.sin(s.p) * .4 * dpr;
      if (s.y > h + 10) { fl[j] = mk(true); continue; }
      c.globalAlpha = s.a; c.beginPath(); c.arc(s.x, s.y, s.r, 0, 6.283); c.fill();
    }
    requestAnimationFrame(draw);
  })();
})();
</script>
</body>
</html>
