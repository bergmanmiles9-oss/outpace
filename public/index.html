<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outpace</title>
  <meta name="description" content="Outpace">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1810;
      font-family: "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bg {
      position: absolute;
      inset: -4%;
      background-image: url('/images/BM.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      will-change: transform;
      transition: transform 0.2s ease-out;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 50%, rgba(26, 24, 16, 0.25) 100%),
        linear-gradient(to bottom, rgba(26, 24, 16, 0.1) 0%, rgba(26, 24, 16, 0.2) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 2rem 1.5rem;
    }

    .title {
      font-size: clamp(3.5rem, 12vw, 8rem);
      font-weight: 800;
      letter-spacing: 0.1em;
      line-height: 1;
      color: #f5f0d8;
      text-shadow:
        0 2px 10px rgba(0, 0, 0, 0.9),
        0 0 40px rgba(201, 180, 88, 0.35);
      opacity: 0;
      transform: translateY(24px);
      animation: titleIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    @keyframes titleIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .subtitle {
      font-size: 0.7rem;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: rgba(232, 217, 138, 0.7);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
      margin: 1.8rem 0 2rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.4s forwards;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      justify-content: center;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.55s forwards;
    }

    .btn-bm {
      display: inline-block;
      min-width: 148px;
      padding: 0.95rem 1.8rem;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary-bm {
      background: #c9b458;
      color: #1a1810;
    }
    .btn-primary-bm:hover {
      background: #e8d98a;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .btn-outline-bm {
      background: rgba(26, 24, 16, 0.6);
      border: 1.5px solid rgba(232, 217, 138, 0.5);
      color: #f5f0d8;
    }
    .btn-outline-bm:hover {
      background: rgba(201, 180, 88, 0.18);
      border-color: #e8d98a;
      transform: translateY(-2px);
    }

    .dust {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .dust span {
      position: absolute;
      border-radius: 50%;
      background: rgba(245, 240, 216, 0.5);
      animation: floatDust linear infinite;
    }

    @keyframes floatDust {
      0%   { transform: translateY(100vh); opacity: 0; }
      10%  { opacity: 0.5; }
      90%  { opacity: 0.3; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="page" id="page">
    <div class="bg" id="bg"></div>
    <div class="overlay"></div>
    <div class="dust" id="dust"></div>

    <div class="content">
      <h1 class="title">Outpace</h1>
      <p class="subtitle">yo!</p>
      <div class="buttons">
        <a class="btn-bm btn-primary-bm" href="https://discord.gg/ZzWwDURXhG" target="_blank" rel="noopener">Discord</a>
        <a class="btn-bm btn-outline-bm" href="https://www.out-pace.org/releasedate">Release</a>
        <a class="btn-bm btn-outline-bm" href="https://www.out-pace.org/apply">Apply for Staff</a>
      </div>
    </div>
  </div>

  <script>
    // Throttled parallax (much lighter)
    const bg = document.getElementById('bg');
    let ticking = false;

    document.addEventListener('mousemove', (e) => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
          const x = (e.clientX / window.innerWidth - 0.5) * 12;
          const y = (e.clientY / window.innerHeight - 0.5) * 9;
          bg.style.transform = `translate(${x}px, ${y}px) scale(1.04)`;
          ticking = false;
        });
        ticking = true;
      }
    });

    // Fewer dust particles
    const dust = document.getElementById('dust');
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('span');
      const size = 1.5 + Math.random() * 2.5;
      s.style.left = Math.random() * 100 + '%';
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.animationDuration = (8 + Math.random() * 10) + 's';
      s.style.animationDelay = (Math.random() * 8) + 's';
      dust.appendChild(s);
    }
  </script>
</body>
</html>
