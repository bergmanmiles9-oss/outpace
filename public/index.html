<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Outpace</title>
    <meta name="description" content="Outpace — outrun what's behind the door.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #08090b;
        --line: rgba(255, 255, 255, 0.06);
        --text: #ece9e4;
        --text-dim: #85888e;
        --accent: #c9553c;
        --accent-ink: #180a06;
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
      }

      body { min-height: 100vh; position: relative; }

      .sr-only {
        position: absolute;
        width: 1px; height: 1px;
        padding: 0; margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* dim vertical seams — a corridor of doors, not a business grid */
      .corridor {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image: repeating-linear-gradient(
          90deg,
          var(--line) 0px,
          var(--line) 1px,
          transparent 1px,
          transparent 130px
        );
        mask-image: radial-gradient(ellipse 85% 65% at 50% 35%, black 20%, transparent 85%);
        -webkit-mask-image: radial-gradient(ellipse 85% 65% at 50% 35%, black 20%, transparent 85%);
      }

      /* single unstable light source overhead, not scattered orbs */
      .glow {
        position: fixed;
        top: -25%;
        left: 50%;
        transform: translateX(-50%);
        width: 820px;
        height: 640px;
        background: radial-gradient(closest-side, rgba(201, 85, 60, 0.16), transparent 72%);
        z-index: 0;
        pointer-events: none;
        animation: breathe 7s ease-in-out infinite;
      }

      @keyframes breathe {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }

      .vignette {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: radial-gradient(ellipse 88% 68% at 50% 38%, transparent 45%, rgba(0,0,0,0.7) 100%);
      }

      /* one-time light spill, like a door easing open */
      .sweep {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: linear-gradient(100deg, transparent 40%, rgba(236, 233, 228, 0.08) 48%, transparent 56%);
        transform: translateX(-60%);
        animation: sweep 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      }

      @keyframes sweep {
        to { transform: translateX(60%); }
      }

      nav {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px clamp(20px, 5vw, 56px);
        backdrop-filter: blur(10px);
        background: linear-gradient(to bottom, rgba(8,9,11,0.9), rgba(8,9,11,0));
      }

      .nav-brand {
        font-family: 'Big Shoulders Display', sans-serif;
        font-weight: 700;
        font-size: 1.4rem;
        letter-spacing: 0.02em;
        color: var(--text);
        text-decoration: none;
        text-transform: uppercase;
      }

      .nav-links { display: flex; gap: 10px; }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 18px;
        border-radius: 6px;
        font-size: 0.92rem;
        font-weight: 500;
        text-decoration: none;
        transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
        white-space: nowrap;
      }

      .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .btn-ghost {
        color: var(--text);
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.02);
      }
      .btn-ghost:hover { border-color: rgba(255, 255, 255, 0.24); background: rgba(255, 255, 255, 0.05); }

      .btn-primary {
        color: var(--accent-ink);
        background: var(--accent);
        border: 1px solid var(--accent);
      }
      .btn-primary:hover { background: #d76a4f; transform: translateY(-1px); }

      main {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 120px 24px 80px;
      }

      .hero {
        text-align: center;
        max-width: 620px;
        opacity: 0;
        transform: translateY(14px);
        animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
      }

      .landing-title {
        font-family: 'Big Shoulders Display', sans-serif;
        font-weight: 700;
        font-size: clamp(3.4rem, 10vw, 6.4rem);
        line-height: 0.92;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        margin: 0 0 16px;
        color: var(--text);
      }

      .landing-sub {
        font-size: clamp(1rem, 2vw, 1.15rem);
        color: var(--text-dim);
        margin: 0 0 40px;
        line-height: 1.5;
      }

      .landing-buttons {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .landing-buttons .btn { padding: 12px 22px; font-size: 0.95rem; }

      @keyframes rise {
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 560px) {
        .nav-links { gap: 6px; }
        .btn { padding: 8px 12px; font-size: 0.82rem; }
        .landing-buttons { flex-direction: column; width: 100%; }
        .landing-buttons .btn { width: 100%; }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero { animation: none; opacity: 1; transform: none; }
        .glow { animation: none; opacity: 0.85; }
        .sweep { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="corridor" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="sweep" aria-hidden="true"></div>

    <nav>
      <a class="nav-brand" href="https://www.out-pace.org/">Outpace</a>
      <div class="nav-links">
        <a class="btn btn-ghost" href="https://discord.gg/ZzWwDURXhG" target="_blank" rel="noopener">Discord</a>
        <a class="btn btn-ghost" href="https://www.out-pace.org/releasedate">Release</a>
        <a class="btn btn-primary" href="https://www.out-pace.org/apply">Apply for Staff</a>
      </div>
    </nav>

    <main>
      <div class="hero">
        <h1 class="landing-title">Outpace</h1>
        <p class="landing-sub">Currently in development.</p>
        <div class="landing-buttons">
          <a class="btn btn-primary" href="https://discord.gg/ZzWwDURXhG" target="_blank" rel="noopener">Discord</a>
          <a class="btn btn-ghost" href="https://www.out-pace.org/releasedate">Release</a>
          <a class="btn btn-ghost" href="https://www.out-pace.org/apply">Apply for Staff</a>
        </div>
      </div>
    </main>
  </body>
</html>
