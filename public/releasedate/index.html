<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Outpace Coming Soon</title>
    <meta name="description" content="Outpace Coming Soon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <script defer src="/__/firebase/12.17.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.17.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.17.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/12.17.0/firebase-analytics-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>

    <style>
      :root {
        --bg: #07111f;
        --night: #0d2031;
        --line: rgba(220, 182, 95, 0.2);
        --text: #eef3fa;
        --text-dim: #9db0c7;
        --accent: #ffb45e;
        --accent-hot: #ffdca4;
        --accent-ink: #1a0d05;
        --lit: 255, 180, 94;
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
      }

      body {
        min-height: 100vh;
        position: relative;
        background: linear-gradient(180deg, var(--bg), var(--night)) fixed;
      }

      .glow {
        position: fixed;
        top: -12%;
        left: 50%;
        transform: translateX(-50%);
        width: 900px;
        max-width: 140vw;
        height: 700px;
        background: radial-gradient(closest-side, rgba(var(--lit), 0.16), transparent 72%);
        z-index: 0;
        pointer-events: none;
        animation: breathe 7s ease-in-out infinite;
      }

      @keyframes breathe {
        0%, 100% { opacity: 0.65; }
        50% { opacity: 1; }
      }

      .vignette {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: radial-gradient(ellipse 88% 68% at 50% 38%, transparent 45%, rgba(3, 9, 20, 0.55) 100%);
      }

      #snow {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }

      /* a caged maintenance lamp hangs over the message and flickers on once */
      .lamp {
        --sw: clamp(60px, 18vw, 80px);
        --lamp-y: 84px;
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: clamp(300px, 70vw, 640px);
        height: 80vh;
        z-index: 1;
        pointer-events: none;
      }
      .cord { position: absolute; left: 50%; top: 0; width: 2px; height: var(--lamp-y); margin-left: -1px; background: #000; }
      .shade {
        position: absolute; left: 50%; top: var(--lamp-y);
        width: var(--sw); height: calc(var(--sw) * .48); margin-left: calc(var(--sw) / -2);
        border-radius: 50% 50% 6px 6px / 100% 100% 6px 6px;
        background: linear-gradient(180deg, #4a4e57, #1c1d21);
      }
      .bulb {
        position: absolute; left: 50%; top: calc(var(--lamp-y) + var(--sw) * .48 - 4px);
        width: calc(var(--sw) * .5); height: 10px; margin-left: calc(var(--sw) / -4);
        border-radius: 50%; background: var(--accent-hot);
        box-shadow: 0 0 40px 14px rgba(var(--lit), .6);
        animation: flick 1.7s linear .4s backwards;
      }
      .cone {
        position: absolute; inset: calc(var(--lamp-y) + var(--sw) * .48) 0 0 0;
        background: linear-gradient(180deg, rgba(var(--lit), .28), rgba(var(--lit), .02));
        clip-path: polygon(calc(50% - var(--sw) / 4) 0, calc(50% + var(--sw) / 4) 0, 100% 100%, 0 100%);
        animation: flick 1.7s linear .4s backwards;
      }
      @keyframes flick {
        0%, 14% { opacity: 0; } 16% { opacity: .9; } 20% { opacity: .05; }
        26% { opacity: 1; } 32% { opacity: .35; } 38%, 100% { opacity: 1; }
      }

      nav {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px clamp(20px, 5vw, 56px);
        background: linear-gradient(to bottom, rgba(7, 17, 31, 0.92), rgba(7, 17, 31, 0));
      }

      .nav-brand {
        font-family: 'Big Shoulders Display', sans-serif;
        font-weight: 700;
        font-size: 1.35rem;
        letter-spacing: 0.02em;
        color: var(--text);
        text-decoration: none;
        text-transform: uppercase;
      }

      .nav-links { display: flex; gap: 10px; }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 18px;
        border-radius: 6px;
        font-size: 0.92rem;
        font-weight: 500;
        text-decoration: none;
        transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
        white-space: nowrap;
      }

      .btn:focus-visible { outline: 2px solid var(--accent-hot); outline-offset: 2px; }

      .btn-ghost {
        color: var(--text);
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.03);
      }
      .btn-ghost:hover { border-color: rgba(var(--lit), 0.55); background: rgba(255, 255, 255, 0.06); }

      .btn-primary {
        color: var(--accent-ink);
        background: var(--accent);
        border: 1px solid var(--accent);
      }
      .btn-primary:hover { background: var(--accent-hot); border-color: var(--accent-hot); transform: translateY(-1px); }

      main {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 150px 24px 110px;
      }

      .hero {
        text-align: center;
        max-width: 560px;
        opacity: 0;
        transform: translateY(14px);
        animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
      }

      .hero-title {
        font-family: 'Big Shoulders Display', sans-serif;
        font-weight: 700;
        font-size: clamp(2.6rem, 7vw, 4rem);
        line-height: 0.98;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        margin: 0 0 16px;
        color: var(--text);
        text-shadow: 0 0 60px rgba(var(--lit), 0.25);
      }

      .hero-sub {
        font-size: clamp(1rem, 2vw, 1.1rem);
        color: var(--text-dim);
        margin: 0 0 36px;
        line-height: 1.55;
      }

      .landing-buttons {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .landing-buttons .btn { padding: 12px 22px; font-size: 0.95rem; }

      @keyframes rise { to { opacity: 1; transform: translateY(0); } }

      /* snow drift along the bottom */
      .snowbank {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        height: 64px;
        z-index: 1;
        pointer-events: none;
      }
      .snowbank svg { display: block; width: 100%; height: 100%; }
      .snowbank .back { fill: #c9d8ee; opacity: 0.55; }
      .snowbank .front { fill: #f4f8ff; }

      #load {
        position: fixed;
        left: 24px;
        bottom: 78px;
        z-index: 3;
        font-size: 0.72rem;
        color: var(--text-dim);
        opacity: 0.6;
        margin: 0;
      }

      @media (max-width: 560px) {
        .nav-links { gap: 6px; }
        .btn { padding: 8px 12px; font-size: 0.82rem; }
        .landing-buttons { flex-direction: column; width: 100%; }
        .landing-buttons .btn { width: 100%; }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero { animation: none; opacity: 1; transform: none; }
        .glow { animation: none; opacity: 0.85; }
        .bulb, .cone { animation: none; }
        #snow { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="lamp" aria-hidden="true"><div class="cone"></div><div class="cord"></div><div class="shade"></div><div class="bulb"></div></div>
    <canvas id="snow" aria-hidden="true"></canvas>
    <div class="snowbank" aria-hidden="true">
      <svg viewBox="0 0 1200 80" preserveAspectRatio="none">
        <path class="back" d="M0 42 C120 18 220 52 340 34 S560 12 700 36 S960 54 1080 30 S1180 22 1200 30 V80 H0 Z"/>
        <path class="front" d="M0 58 C140 40 260 66 400 52 S640 36 780 56 S1040 70 1200 48 V80 H0 Z"/>
      </svg>
    </div>

    <nav>
      <a class="nav-brand" href="https://www.out-pace.org/">Outpace</a>
      <div class="nav-links">
        <a class="btn btn-ghost" href="https://www.out-pace.org/">Home</a>
        <a class="btn btn-primary" href="https://www.out-pace.org/apply">Apply for Staff</a>
      </div>
    </nav>

    <main>
      <div class="hero">
        <h1 class="hero-title">Coming soon&hellip;</h1>
        <p class="hero-sub">We don’t know yet!</p>
        <div class="landing-buttons">
          <a class="btn btn-ghost" href="https://www.out-pace.org/">Home</a>
          <a class="btn btn-primary" href="https://www.out-pace.org/apply">Apply for Staff</a>
        </div>
      </div>
    </main>

    <p id="load">Firebase SDK Loading&hellip;</p>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var loadEl = document.getElementById('load');
        try {
          var app = firebase.app();
          var features = ['auth', 'firestore', 'analytics'].filter(function (f) {
            return typeof app[f] === 'function';
          });
          loadEl.textContent = 'Firebase SDK loaded with ' + features.join(', ');
        } catch (err) {
          console.error(err);
          loadEl.textContent = 'Error loading the Firebase SDK.';
        }

        // snowfall
        var canvas = document.getElementById('snow');
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduceMotion || !canvas.getContext) return;
        var ctx = canvas.getContext('2d');
        var flakes = [], w = 0, h = 0, dpr = 1;

        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = canvas.width = window.innerWidth * dpr;
          h = canvas.height = window.innerHeight * dpr;
        }
        function makeFlake(anywhere) {
          var r = (Math.random() * 2 + 0.6) * dpr;
          return {
            x: Math.random() * w,
            y: anywhere ? Math.random() * h : -10,
            r: r,
            vy: (r / dpr * 0.3 + 0.3) * dpr,
            p: Math.random() * 6.28,
            a: Math.random() * 0.4 + 0.3
          };
        }
        function seed() {
          flakes = [];
          for (var i = 0; i < 110; i++) flakes.push(makeFlake(true));
        }
        function frame() {
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = '#fff';
          for (var i = 0; i < flakes.length; i++) {
            var f = flakes[i];
            f.p += 0.012; f.y += f.vy; f.x += Math.sin(f.p) * 0.4 * dpr;
            if (f.y > h + 10) { flakes[i] = makeFlake(false); continue; }
            ctx.globalAlpha = f.a;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            ctx.fill();
          }
          requestAnimationFrame(frame);
        }
        resize(); seed(); frame();
        window.addEventListener('resize', function () { resize(); seed(); });
      });
    </script>
  </body>
</html>
